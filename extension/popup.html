<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HashGuard Sentinel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h2>🛡️ HashGuard</h2>
    <div class="tagline">Zero-Knowledge Breach & Entropy Sentinel</div>
  </div>

  <div class="input-container">
    <input type="password" id="passwordInput" placeholder="Enter or paste password..." autocomplete="off">
    <span class="toggle-password" id="togglePassword" title="Show/Hide Password">👁️</span>
  </div>

  <div class="button-group">
    <button id="checkBtn">Check Password</button>
    <button id="mutateBtn" class="mutate-btn">✨ Suggest Safer Version</button>
    <button id="generateBtn">Generate Secure 16-Char ⚡</button>
  </div>

  <!-- Intelligent Mutator Output Area -->
  <div id="mutatedOutput" class="mutated-box" style="display: none;">
    <div class="mutated-header">
      <span class="mutated-title">Suggested Safer Version</span>
      <button id="copyMutatedBtn" class="copy-btn">Copy</button>
    </div>
    <div id="mutatedText" class="mutated-text"></div>
    <div id="mutatedNote" class="mutated-note" style="display: none;"></div>
  </div>

  <div id="resultBox" class="result-box">
    <!-- Breach Status Result -->
    <div id="breachStatus" class="result-row"></div>

    <!-- Visual Strength Meter -->
    <div class="result-row" id="strengthContainer" style="margin-top: 10px;">
      <div class="meter-label-container">
        <span><strong>Strength:</strong></span>
        <span id="strengthLabel" style="font-weight: bold;">-</span>
      </div>
      <div class="meter-track">
        <div id="meterFill" class="meter-fill"></div>
      </div>
    </div>

    <!-- Crack Time Display -->
    <div id="crackTime" class="result-row"></div>

    <!-- Warning / Feedback Banner -->
    <div id="warningBanner" class="warning-banner" style="display: none;"></div>

    <!-- Recommendation Box -->
    <div id="recommendation" class="recommendation-box" style="display: none;"></div>
  </div>

  <!-- Load bundled local zxcvbn library first for zero-knowledge compliance -->
  <script src="libs/zxcvbn.js"></script>
  <!-- Load popup script -->
  <script src="popup.js"></script>
</body>
</html>
